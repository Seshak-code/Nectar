[package]
name = "nectar-app"
description = "nectar.exe: lend this PC's GPU, or borrow one from another PC"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nectar"
path = "src/main.rs"

[dependencies]
nectar-cuda-protocol.workspace = true
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
