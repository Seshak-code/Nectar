[package]
name = "vk-probe"
description = "Checks a Vulkan driver end to end with a compute shader, for comparing Nectar's with the real one"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libloading.workspace = true
nectar-vk-sys.workspace = true
nectar-vk-wire.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
