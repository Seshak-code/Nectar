[package]
name = "nectar-svc"
description = "The borrower's service: finds lenders, holds the lease, writes borrow.cfg"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nectar-cuda-protocol.workspace = true
nectar-lending.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Services"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
